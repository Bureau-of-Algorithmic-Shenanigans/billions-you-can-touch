name: Check source links

# Weekly check that every source linked on the page still answers; opens an issue when links break.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --timeout 30 --accept 200,201,204,301,302,403,429 "src/**/*.js" "src/**/*.astro"
          fail: false
      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken source links
          content-filepath: ./lychee/out.md
          labels: sources
