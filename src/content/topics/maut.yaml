    url: https://www.beck-aktuell.de/heute-im-recht/rechtspolitik-gesetzgebung/gescheiterte-pkw-maut-kosten-steuerzahler-millionen-2025-09-04
  - title: Keine Klage gegen Scheuer (t-online)
    url: https://www.t-online.de/nachrichten/deutschland/id_100310228/pkw-maut-bund-klagt-nicht-gegen-ex-verkehrsminister-scheuer.html
