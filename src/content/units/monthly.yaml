# yaml-language-server: $schema=../schemas/units.schema.json
# Slide „Pro Jahr: laufende Kosten pro Monat oder Jahr (Miete, Tickets, Renten, Gehälter).“
# Each entry is one comparison tile; see CONTRIBUTING.md for the fields.

- id: deutschlandticket
  icon: ticket
  name: { de: Deutschlandticket, en: Deutschlandticket }
  price: 63
  period: month
  count: { de: Personen ein Jahr lang, en: people for a year }
  priceNote: { de: "63 €/Monat Fahrgastpreis, ohne Zuschuss", en: "€63/month fare, without subsidy" }
  for: [transit, student, school, i1, i2, big]

- id: deutschlandticket-mit-zuschuss
  icon: ticket
  name: { de: Deutschlandticket inkl. Zuschuss, en: Deutschlandticket incl. subsidy }
  price: 63 + 2 * 1,5 Mrd. / 12 / 14,6 Mio.
  period: month
  count: { de: Personen ein Jahr lang, en: people for a year }
  priceNote:
    de: 80,12 €/Monat = 63 € Fahrgast + 8,56 € Bund + 8,56 € Länder
    en: €80.12/month = €63 passenger + €8.56 federal + €8.56 states
  for: [transit, student, school, big]

